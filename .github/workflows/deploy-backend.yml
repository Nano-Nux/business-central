name: Build and deploy backend

on:
  push:
    branches: [production]
    paths:
      - "business-central-backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-central-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: business-central-backend/go.mod
          cache-dependency-path: business-central-backend/go.sum

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Linux runtime artifact
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf ../dist
          mkdir -p ../dist/docs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/business-central-backend ./cmd/server
          cp schema.sql ../dist/schema.sql
          cp docs/index.html docs/openapi.yaml ../dist/docs/
          chmod 0755 ../dist/business-central-backend
          tar -czf "../business-central-${RELEASE_ID}.tar.gz" \
            -C ../dist .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-central-${{ github.sha }}
          path: business-central-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: business-central-${{ github.sha }}

      - name: Install deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Copy artifact to VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          scp -P "$DEPLOY_PORT" \
            "business-central-${RELEASE_ID}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/business-central-${RELEASE_ID}.tar.gz"

      - name: Activate release and run health check
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/opt/business-central/bin/deploy-release.sh /tmp/business-central-${RELEASE_ID}.tar.gz ${RELEASE_ID}"
