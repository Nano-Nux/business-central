    TransactionRefund:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        status: { type: string }
        amount: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
      required: [id, payment_id, order_id, status, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, CANCELLED] }
        amount: { type: string }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    RefundEnvelope:
      type: object
      required: [data, meta]
