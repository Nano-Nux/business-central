    post: { tags: [Repairs], summary: Add a repair part, operationId: createRepairPart, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '201': { description: Part created, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/parts/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch: { tags: [Repairs], summary: Update a repair part, operationId: updateRepairPart, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '200': { description: Part updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
    delete: { tags: [Repairs], summary: Delete a repair part, operationId: deleteRepairPart, security: [{ bearerAuth: [] }], responses: { '204': { description: Part deleted } } }
  /api/v1/repairs/orders/{orderId}/approvals:
