openapi: 3.0.3
info:
  title: Business Central Backend API
  version: 0.1.0
  description: |
    Contract-first OpenAPI documentation for the Business Central backend.

    Health, authentication, authorization, commerce, reporting, service, and
    repair endpoints are implemented. Reusable schemas, security conventions,
    response envelopes, required error codes, and collection query semantics
    are documented here.
  license:
    name: Proprietary
  x-business-central-status: implemented-current-scope
servers:
  - url: http://localhost:8080
    description: Local backend (when the HTTP runtime is available)
tags:
  - name: System
    description: Service and database health checks.
  - name: Authentication
    description: Credential and session management.
  - name: Users
    description: Merchant-scoped user memberships and role assignments.
  - name: Merchants
    description: Platform and merchant administration.
  - name: Customers
    description: Merchant-scoped customer master data.
  - name: Catalog
    description: Products, variants, pricing, and catalog data.
  - name: Media
    description: Shared image URL normalization and SeaweedFS upload.
  - name: Orders
    description: Canonical orders, payments, refunds, and fulfillment.
  - name: Inventory
    description: Locations, movements, balances, and costing.
  - name: Reports
    description: Sales analysis, profit, refunds, and inventory cost reporting.
  - name: Services
    description: Merchant service catalog, work orders, scheduling, notes, and billing.
  - name: Repairs
    description: Repair devices, repair lifecycle, diagnostics, parts, approvals, and warranties.
  - name: Synchronization
    description: Online mobile synchronization and conflict handling.
paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: health
      security: []
      responses:
        '200':
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/db:
    get:
      tags: [System]
      summary: Check API and database health
      operationId: databaseHealth
      security: []
      responses:
        '200':
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/currencies:
    get:
      tags: [System]
      summary: List supported currencies
      operationId: listCurrencies
      security: []
      responses:
        '200':
          description: Supported currencies usable when creating a merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyCollectionEnvelope'
  /api/v1/admin/currencies:
    get:
      tags: [Merchants]
      summary: List platform currencies as an administrator
      operationId: adminListCurrencies
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Platform currencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyCollectionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchants]
      summary: Create a platform currency
      operationId: createCurrency
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCurrencyRequest'
      responses:
        '201':
          description: Platform currency created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/currencies/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
    get:
      tags: [Merchants]
      summary: Get a platform currency
      operationId: getCurrency
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Platform currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Merchants]
      summary: Update a platform currency
      operationId: updateCurrency
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrencyRequest'
      responses:
        '200':
          description: Platform currency updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Merchants]
      summary: Delete a platform currency
      operationId: deleteCurrency
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Platform currency deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access and refresh token were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The authenticated user and active membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: The refresh token was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/merchants:
    get:
      tags: [Merchants]
      summary: List merchants
      operationId: listMerchants
      security: [{ bearerAuth: [] }]
      description: Only a platform-admin identity may call this operation.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of merchants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchants]
      summary: Create a merchant and default roles
      operationId: createMerchantAccount
      security: [{ bearerAuth: [] }]
      description: Only a platform-admin identity may call this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantAccountRequest'
      responses:
        '201':
          description: The merchant and default Manager and Staff roles were created. No user account is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccountEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/merchant-users:
    post:
      tags: [Merchants, Users]
      summary: Create a merchant and its owner user
      operationId: createMerchantUser
      security: [{ bearerAuth: [] }]
      description: >-
        Only a platform-admin identity may call this operation. It atomically
        creates the merchant, system roles, owner user, membership, and owner
        role assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantUserRequest'
      responses:
        '201':
          description: The merchant and owner user were created together.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantUserProvisioningEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/merchants/{id}:
    patch:
      tags: [Merchants]
      summary: Update merchant settings or active state
      operationId: updateMerchant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantRequest'
      responses:
        '200':
          description: The merchant was updated. Setting is_active false deactivates access without deleting the merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/merchants/{id}/roles:
    get:
      tags: [Users]
      summary: List roles for a merchant
      operationId: listMerchantRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Roles available for user membership assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Users]
      summary: Create a role for a merchant
      operationId: createMerchantRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Merchant role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/merchants/{id}/roles/{roleId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - name: roleId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Users]
      summary: Get a merchant role
      operationId: getMerchantRole
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Merchant role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a merchant role
      operationId: updateMerchantRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Merchant role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      summary: Delete a custom merchant role
      operationId: deleteMerchantRole
      description: System roles cannot be deleted. Removing a custom role also removes its membership assignments.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Merchant role deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/permissions:
    get:
      tags: [Users]
      summary: List permissions available for role assignment
      operationId: listPermissions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Platform permission catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCollectionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users in the current merchant
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MerchantIDHeader'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of merchant memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a Manager or Staff user in a merchant
      description: Platform administrators select the target merchant with X-Merchant-ID. Merchant managers create users within their authenticated merchant; users cannot be created across merchant boundaries.
      operationId: createUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MerchantIDHeader'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: The user membership was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/MerchantIDHeader'
    get:
      tags: [Users]
      summary: Get a user membership
      operationId: getUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The requested user membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user membership
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The user membership was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      summary: Deactivate a user membership
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: The membership was deactivated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/catalog/products:
    get:
      tags: [Catalog]
      summary: List products in the current merchant
      operationId: listCatalogProducts
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Merchant products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCollectionEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      summary: Create a product for the current merchant
      operationId: createCatalogProduct
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
      responses:
        '201': { description: Product created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/catalog/products/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [Catalog]
      summary: Get a merchant product
      operationId: getCatalogProduct
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      summary: Update a merchant product
      operationId: updateCatalogProduct
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
      responses:
        '200': { description: Product updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      summary: Delete an unused merchant product and its variant aggregate
      operationId: deleteCatalogProduct
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Product deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/units:
    get:
      tags: [Catalog]
      summary: List units in the current merchant
      operationId: listUnits
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Merchant units, content: { application/json: { schema: { $ref: '#/components/schemas/UnitCollectionEnvelope' } } } }
    post:
      tags: [Catalog]
      summary: Create a unit for the current merchant
      operationId: createUnit
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitRequest' } } } }
      responses:
        '201': { description: Unit created, content: { application/json: { schema: { $ref: '#/components/schemas/UnitEnvelope' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/catalog/products/{productId}/variants:
    parameters: [{ $ref: '#/components/parameters/ProductID' }]
    get:
      tags: [Catalog]
      summary: List variants for a merchant product
      operationId: listProductVariants
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Product variants, content: { application/json: { schema: { $ref: '#/components/schemas/VariantCollectionEnvelope' } } } } }
    post:
      tags: [Catalog]
      summary: Create a variant for a merchant product
      operationId: createProductVariant
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantRequest' } } } }
      responses: { '201': { description: Product variant created, content: { application/json: { schema: { $ref: '#/components/schemas/VariantEnvelope' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/catalog/variants/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [Catalog]
      summary: Get a merchant product variant
      operationId: getProductVariant
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Product variant, content: { application/json: { schema: { $ref: '#/components/schemas/VariantEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Catalog]
      summary: Update a merchant product variant
      operationId: updateProductVariant
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantRequest' } } } }
      responses: { '200': { description: Product variant updated, content: { application/json: { schema: { $ref: '#/components/schemas/VariantEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Catalog]
      summary: Delete a merchant product variant
      operationId: deleteProductVariant
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Product variant deleted }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/catalog/attributes:
    get:
      tags: [Catalog]
      summary: List configured product variant attributes
      operationId: listCatalogAttributeDefinitions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Merchant attribute definitions and reusable values, content: { application/json: { schema: { $ref: '#/components/schemas/AttributeDefinitionCollectionEnvelope' } } } } }
    post:
      tags: [Catalog]
      summary: Create a product variant attribute definition
      operationId: createCatalogAttributeDefinition
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttributeDefinitionRequest' } } } }
      responses: { '201': { description: Attribute definition created, content: { application/json: { schema: { $ref: '#/components/schemas/AttributeDefinitionEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/catalog/attributes/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [Catalog]
      summary: Get a product variant attribute definition
      operationId: getCatalogAttributeDefinition
      security: [{ bearerAuth: [] }]
