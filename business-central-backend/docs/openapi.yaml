    post: { tags: [Repairs], summary: Add a repair diagnostic, operationId: createRepairDiagnostic, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '201': { description: Diagnostic created, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/diagnostics/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch: { tags: [Repairs], summary: Update a repair diagnostic, operationId: updateRepairDiagnostic, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '200': { description: Diagnostic updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
    delete: { tags: [Repairs], summary: Delete a repair diagnostic, operationId: deleteRepairDiagnostic, security: [{ bearerAuth: [] }], responses: { '204': { description: Diagnostic deleted } } }
  /api/v1/repairs/orders/{orderId}/parts:
