      properties:
        entry: { $ref: '#/components/schemas/TransactionHistoryEntry' }
        order: { $ref: '#/components/schemas/TransactionOrderDetail' }
        lines: { type: array, items: { $ref: '#/components/schemas/TransactionOrderLine' } }
        payments: { type: array, items: { $ref: '#/components/schemas/TransactionPayment' } }
        refunds: { type: array, items: { $ref: '#/components/schemas/TransactionRefund' } }
        total_cost: { type: string }
        gross_profit: { type: string }
        gross_margin: { type: string }
    TransactionHistoryDetailEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TransactionHistoryDetail' }
        meta: { type: object }
    StockMovementDetail:
      type: object
      required: [movement, product_name, variant_name, sku, total_cost, cost_allocations]
      properties:
        movement: { type: object, description: "Immutable canonical inventory movement including IDs, quantity, unit cost, event key, and timestamps." }
        product_name: { type: string }
        product_description: { type: string }
        variant_name: { type: string }
        sku: { type: string }
        barcode: { type: string }
        unit_name: { type: string }
        unit_symbol: { type: string }
        source_location_name: { type: string }
        source_location_code: { type: string }
        destination_location_name: { type: string }
        destination_location_code: { type: string }
        total_cost: { type: string }
        source_quantity_on_hand: { type: string, nullable: true }
        source_quantity_reserved: { type: string, nullable: true }
        destination_quantity_on_hand: { type: string, nullable: true }
        destination_quantity_reserved: { type: string, nullable: true }
        receipt: { type: object, description: "Goods receipt, purchase order, supplier, batch, expiry, quantity, and original cost when this is a receipt." }
        order: { type: object, description: Canonical checkout order and line pricing when this movement is linked to an order. }
        cost_allocations:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              cost_layer_id: { type: string, format: uuid }
              quantity: { type: string }
              unit_cost: { type: string }
              total_cost: { type: string }
              layer_quantity_received: { type: string }
              layer_quantity_remaining: { type: string }
              source_receipt_number: { type: string }
    StockMovementDetailEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/StockMovementDetail' }
        meta: { type: object }
    CreateRepairTicketRequest:
      type: object
      required: [idempotency_key, order_number, shop_id]
      properties:
        idempotency_key: { type: string }
        order_number: { type: string }
        shop_id: { type: string, format: uuid }
        priority: { type: string }
        device:
          type: object
          required: [device_type]
          properties:
            device_type: { type: string }
            manufacturer: { type: string }
            model: { type: string }
            serial_number: { type: string }
            metadata: { type: object }
        issue_description: { type: string, description: Legacy alias for the first work item issue. }
        work_items:
          type: array
          minItems: 1
          maxItems: 100
          description: Repeatable service subjects. When omitted, the legacy device and issue fields are normalized into one DEVICE work item.
          items:
            $ref: '#/components/schemas/RepairWorkItemRequest'
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        customer_phone: { type: string }
        service_id: { type: string, format: uuid, description: Active repair catalog item; its labor fee is loaded by the backend. }
        service_items:
          type: array
          maxItems: 100
          description: Billable services or product variants. Prices are resolved by the backend.
          items:
            oneOf:
              - type: object
                required: [service_id, quantity]
                properties:
                  service_id: { type: string, format: uuid }
                  work_item_id: { type: string, format: uuid, description: Required when the ticket contains multiple work items. }
                  quantity: { type: string }
              - type: object
                required: [variant_id, quantity]
                properties:
                  variant_id: { type: string, format: uuid }
                  work_item_id: { type: string, format: uuid, description: Required when the ticket contains multiple work items. }
                  quantity: { type: string }
        promotion_id: { type: string, format: uuid }
        additional_fee: { type: string }
        note: { type: string }
        payment_status: { type: string, enum: [UNPAID, DEPOSIT_PAID, PAID] }
        deposit_amount: { type: string }
        payment_type_id: { type: string, format: uuid }
        payment_method: { type: string, deprecated: true, description: Historical compatibility snapshot; new clients select payment_type_id. }
        parts:
          type: array
          items:
            type: object
            required: [variant_id, quantity]
            properties:
              work_item_id: { type: string, format: uuid, description: Work item receiving this part; required for billable parts on multi-work-item tickets. }
              variant_id: { type: string, format: uuid }
              quantity: { type: string }
              promotion_id: { type: string, format: uuid }
        images:
          type: array
          items:
            type: object
            required: [filename, content_type]
            properties:
              work_item_id: { type: string, format: uuid, description: Work item receiving this image; omit for a ticket-level image. }
              filename: { type: string }
              content_type: { type: string }
              image_url: { type: string, format: uri }
              source_type: { type: string, enum: [URL, GOOGLE_DRIVE, UPLOAD] }
              data_base64: { type: string, format: byte, deprecated: true, description: Legacy mobile/offline compatibility. }
    RepairWorkItemRequest:
      type: object
      required: [device, issue_description]
      properties:
        id: { type: string, format: uuid, description: Optional client-generated ID retained for offline reconciliation. }
        type: { type: string, enum: [DEVICE, VEHICLE, PATIENT, OTHER], default: DEVICE }
        device:
          type: object
          required: [device_type]
          properties:
            device_type: { type: string }
            manufacturer: { type: string }
            model: { type: string }
            serial_number: { type: string }
            metadata: { type: object }
        issue_description: { type: string }
        issues: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 500 }, description: Canonical issue list; issue_description remains the first-item compatibility alias. }
        conditions: { type: array, maxItems: 20, items: { type: string, maxLength: 500 } }
        note: { type: string }
        additional_fee: { type: string, description: Device-specific price. The additional_fee name is retained for API and database compatibility; ticket-level additional_fee remains a legacy single-work-item alias. }
        waiting_days: { type: integer, minimum: 0, description: Number of calendar days from the automatic device waiting start. May be supplied instead of waiting_end_date. }
        waiting_end_date: { type: string, format: date, description: Expected device waiting end. May be supplied instead of waiting_days. }
        fields: { type: object, additionalProperties: true }
    RepairTicketEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [device, work_items, service_items, service_order, repair_order, parts, diagnostics, approvals, warranties, images]
          properties:
            device: { type: object }
            work_items: { type: array, items: { $ref: '#/components/schemas/RepairWorkItem' } }
            service_items: { type: array, items: { type: object }, description: Billable service/product/part projections attached to the parent service order. }
            service_order: { type: object }
            repair_order: { type: object }
            parts: { type: array, items: { type: object } }
            diagnostics: { type: array, items: { type: object } }
            approvals: { type: array, items: { type: object } }
            warranties: { type: array, items: { type: object } }
            payment: { type: object }
            images: { type: array, items: { type: object } }
            custom_fields: { type: object, additionalProperties: true }
            form_version: { type: integer, minimum: 1 }
        meta: { type: object }
    RepairWorkItem:
      type: object
      required: [id, service_order_id, sequence_number, type, status, device, issue_description]
      properties:
        id: { type: string, format: uuid }
        service_order_id: { type: string, format: uuid }
        sequence_number: { type: integer, minimum: 1 }
        type: { type: string, enum: [DEVICE, VEHICLE, PATIENT, OTHER] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED] }
        summary: { type: string, nullable: true }
        device: { type: object }
        issue_description: { type: string }
        issues: { type: array, items: { type: string } }
        conditions: { type: array, items: { type: string } }
        note: { type: string, nullable: true }
        fields: { type: object, additionalProperties: true }
        form_version: { type: integer, minimum: 1 }
        additional_fee: { type: string }
        waiting_start_date: { type: string, format: date, readOnly: true }
        waiting_end_date: { type: string, format: date }
        waiting_days: { type: integer, minimum: 0, readOnly: true }
        financials:
          type: object
          required: [subtotal, discount_total, tax_amount, total, paid, balance]
          properties:
            subtotal: { type: string }
            discount_total: { type: string }
            tax_amount: { type: string }
            total: { type: string }
            paid: { type: string }
            balance: { type: string }
    RepairWorkItemUpdateRequest:
      type: object
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED] }
        summary: { type: string, nullable: true }
        assigned_membership_id: { type: string, format: uuid, nullable: true }
        issue_description: { type: string }
        issues: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 500 } }
        conditions: { type: array, maxItems: 20, items: { type: string, maxLength: 500 } }
        note: { type: string, nullable: true }
        waiting_days: { type: integer, minimum: 0 }
        waiting_end_date: { type: string, format: date }
        device:
          type: object
          properties:
            customer_id: { type: string, format: uuid, nullable: true }
            device_type: { type: string }
            manufacturer: { type: string, nullable: true }
            model: { type: string, nullable: true }
            serial_number: { type: string, nullable: true }
            metadata: { type: object }
        fields: { type: object, additionalProperties: true }
    RepairPresetRequest:
      type: object
      required: [shop_id, preset_type, value]
      properties:
        shop_id: { type: string, format: uuid }
        preset_type: { type: string, enum: [ISSUE, CONDITION] }
        value: { type: string, minLength: 1, maxLength: 500 }
    RepairPaymentRequest:
      type: object
      required: [kind, payment_type_id, amount, idempotency_key]
      properties:
        kind: { type: string, enum: [DEPOSIT, FINAL, ADJUSTMENT] }
        payment_type_id: { type: string, format: uuid }
        amount: { type: string }
        idempotency_key: { type: string }
        allocations:
          type: array
          description: Optional for a single work item; required for multi-work-item offline synchronization. Online requests without allocations are allocated deterministically by outstanding balance.
          items:
            type: object
            required: [work_item_id, amount]
            properties:
              work_item_id: { type: string, format: uuid }
              amount: { type: string }
    CustomFieldDefinitionRequest:
      type: object
      required: [entity_type, field_scope, field_code, label, value_type]
      properties:
        entity_type: { type: string, enum: [SERVICE_TICKET, SERVICE_WORK_ITEM, REPAIR_TICKET, REPAIR_WORK_ITEM], example: REPAIR_WORK_ITEM }
        module_code: { type: string, default: SERVICE }
        service_type: { type: string, enum: [GENERAL, REPAIR, CLINICAL], nullable: true }
        field_scope: { type: string, enum: [TICKET, WORK_ITEM] }
        field_code: { type: string }
        label: { type: string }
        value_type: { type: string, enum: [TEXT, NUMBER, BOOLEAN, DATE, SELECT, JSON] }
        is_required: { type: boolean }
        options: { type: array, items: {} }
        validation_rules: { type: object, additionalProperties: true }
        visibility_rules: { type: object, additionalProperties: true }
        display_order: { type: integer }
        section: { type: string, nullable: true }
        printable: { type: boolean }
        is_active: { type: boolean, nullable: true }
    CustomFieldValueRequest:
      type: object
      required: [definition_id, value]
      properties:
        definition_id: { type: string, format: uuid }
        form_version: { type: integer, minimum: 1 }
        value: {}
    CustomFieldValue:
      type: object
      required: [id, merchant_id, definition_id, entity_type, entity_id, form_version, value]
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        definition_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        form_version: { type: integer, minimum: 1 }
        value: {}
    CustomFieldDefinition:
      allOf:
        - $ref: '#/components/schemas/CustomFieldDefinitionRequest'
        - type: object
          required: [id, merchant_id, form_version, is_active, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            merchant_id: { type: string, format: uuid }
            form_version: { type: integer, minimum: 1 }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ErrorFields:
      type: object
      description: Field-level validation details keyed by request field name.
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_CONFLICT
            - MODULE_DISABLED
            - OFFLINE_OPERATION_REJECTED
            - INTERNAL_ERROR
        message:
          type: string
        fields:
          $ref: '#/components/schemas/ErrorFields'
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          $ref: '#/components/schemas/UUID'
      additionalProperties: false
  examples:
    ValidationError:
      summary: Validation failure
      value:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid.
          fields:
            name: Name is required.
        request_id: 00000000-0000-0000-0000-000000000000
