      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Repair approvals, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } } } }
    post: { tags: [Repairs], summary: Create a repair approval, operationId: createRepairApproval, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '201': { description: Approval created, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/approvals/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch: { tags: [Repairs], summary: Update a repair approval, operationId: updateRepairApproval, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '200': { description: Approval updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
    delete: { tags: [Repairs], summary: Delete a repair approval, operationId: deleteRepairApproval, security: [{ bearerAuth: [] }], responses: { '204': { description: Approval deleted } } }
  /api/v1/repairs/orders/{orderId}/warranties:
    parameters: [{ $ref: '#/components/parameters/OrderID' }]
    get:
      tags: [Repairs]
      summary: List repair warranties
      operationId: listRepairWarranties
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Filter' }, { $ref: '#/components/parameters/PageIndex' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Repair warranties, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } } } }
    post: { tags: [Repairs], summary: Create a repair warranty, operationId: createRepairWarranty, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '201': { description: Warranty created, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/warranties/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch: { tags: [Repairs], summary: Update a repair warranty, operationId: updateRepairWarranty, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }, responses: { '200': { description: Warranty updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
    delete: { tags: [Repairs], summary: Delete a repair warranty, operationId: deleteRepairWarranty, security: [{ bearerAuth: [] }], responses: { '204': { description: Warranty deleted } } }
  /api/v1/sync/handshake:
    post:
      tags: [Synchronization]
      summary: Register a client device and open a synchronization session
      operationId: synchronizationHandshake
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncHandshakeRequest' }
      responses:
        '200':
          description: Synchronization protocol and session information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncHandshakeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/sync/push:
    post:
      tags: [Synchronization]
      summary: Upload idempotent client operations
      description: Tenant-scoped settings, catalog, measurement, delivery, repair, and POS synchronization operations are accepted according to their domain policies. Repair aggregate REPAIR_TICKET CREATE is atomic across all work items and preserves supplied work-item UUIDs. REPAIR_DIAGNOSTIC, REPAIR_IMAGE, REPAIR_PART, REPAIR_APPROVAL, REPAIR_WARRANTY, and cash-only REPAIR_PAYMENT CREATE operations are dependency-ordered behind the parent and validate tenant, shop, repair-order, and optional work-item scope. Catalog-part promotions and external payment methods remain online-only; unsupported mutations return visible rejection results.
      operationId: synchronizationPush
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: Per-operation results, including accepted, rejected, and conflict outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/sync/conflicts/{operationId}/resolve:
    post:
      tags: [Synchronization]
      summary: Resolve an open synchronization conflict
      description: SHOP_SETTINGS conflicts can keep the authoritative server copy or explicitly rebase and apply the validated client change. Resolution is tenant-scoped and idempotent.
      operationId: resolveSynchronizationConflict
      security: [{ bearerAuth: [] }]
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncConflictResolutionRequest' }
      responses:
        '200':
          description: Authoritative conflict resolution result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConflictResolutionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/sync/pull:
    post:
      tags: [Synchronization]
      summary: Download merchant changes after a durable checkpoint
      operationId: synchronizationPull
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPullRequest' }
      responses:
        '200':
          description: Ordered synchronization changes and checkpoint information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send the access token returned by login or refresh as
        Authorization: Bearer <access-token>. Refresh tokens are rotated by
        POST /api/v1/auth/refresh.
  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: User membership UUID.
      schema:
        type: string
        format: uuid
    ResourceID:
      name: id
      in: path
      required: true
      description: Merchant resource UUID.
      schema:
        type: string
        format: uuid
    OrderID:
      name: orderId
      in: path
      required: true
      description: Parent service or repair order UUID.
      schema:
        type: string
        format: uuid
    ProductID:
      name: productId
      in: path
      required: true
      description: Merchant product UUID.
      schema:
        type: string
        format: uuid
    ShopID:
      name: shopId
      in: path
      required: true
      description: Merchant shop UUID.
      schema:
        type: string
        format: uuid
    CategoryID:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantID:
      name: variantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MerchantIDHeader:
      name: X-Merchant-ID
      in: header
      required: false
      description: Merchant scope selected by a platform administrator for tenant-scoped operations. Merchant users use the merchant from their authenticated session and should omit this header.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      deprecated: true
      description: Legacy one-based page number. Prefer page_index.
      schema:
        type: integer
        minimum: 1
        default: 1
    Query:
      name: query
      in: query
      required: false
      description: Case-insensitive text search over the endpoint's searchable fields.
      schema: { type: string }
    Filter:
      name: filter
      in: query
      required: false
      description: Comma- or semicolon-separated equality filters, for example status:OPEN,is_active:true.
      schema: { type: string }
    PageIndex:
      name: page_index
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client-supplied correlation identifier.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key for retry-safe commands. Reusing a key with the
        same request returns the original result; reusing it with a different
        request returns `IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              $ref: '#/components/examples/ValidationError'
    Unauthorized:
      description: Authentication is required or the credentials are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist in the authorized tenant context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The command conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key was already used with a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleDisabled:
      description: The requested capability is not enabled for the merchant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OfflineOperationRejected:
      description: The operation is not valid for the current online/offline mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PaymentTypeRequest:
      type: object
      required: [name, category_code]
      properties:
        name: { type: string, maxLength: 255 }
        category_code: { type: string, enum: [CASH, ONLINE, DIGITAL] }
        is_active: { type: boolean }
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: business-central-backend
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    DatabaseHealthResponse:
      type: object
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        merchant_id:
          $ref: '#/components/schemas/UUID'
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Session:
      type: object
      required: [access_token, refresh_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
    SessionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    Role:
      type: object
      required: [id, code, name, is_system, permission_codes]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
        name:
          type: string
        is_system:
          type: boolean
        permission_codes:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      required: [code, name, permission_codes]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9][a-z0-9._-]*$'
        name:
          type: string
          minLength: 1
          maxLength: 255
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    UpdateRoleRequest:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9][a-z0-9._-]*$'
        name:
          type: string
          minLength: 1
          maxLength: 255
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    Permission:
      type: object
      required: [code]
      properties:
        code:
          type: string
        description:
          type: string
          nullable: true
    RoleEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    RoleCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    PermissionCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    Currency:
      type: object
      required: [code, name, decimal_places]
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
          nullable: true
        decimal_places:
          type: integer
          minimum: 0
          maximum: 6
    CreateCurrencyRequest:
      type: object
      required: [code, name, decimal_places]
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          nullable: true
        decimal_places:
          type: integer
          minimum: 0
          maximum: 6
    UpdateCurrencyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          nullable: true
        decimal_places:
          type: integer
          minimum: 0
          maximum: 6
    CurrencyEnvelope:
      allOf: [{ $ref: '#/components/schemas/ResourceEnvelope' }]
    CurrencyCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    User:
      type: object
      required: [id, membership_id, merchant_id, email, display_name, is_active, roles, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        membership_id:
          $ref: '#/components/schemas/UUID'
        merchant_id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        display_name:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        platform_admin:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    UserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    UserCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/CollectionMeta'
    ProductRequest:
      type: object
      required: [name]
      properties:
        brand_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        product_type: { type: string, enum: [PHYSICAL, DIGITAL, SERVICE], default: PHYSICAL }
        manufacture_date: { type: string, format: date, nullable: true, description: Optional product manufacture date in YYYY-MM-DD format. }
        expired_date: { type: string, format: date, nullable: true, description: Optional product expiration date in YYYY-MM-DD format. }
        is_active: { type: boolean }
        category_ids:
          type: array
          description: Complete category selection to apply atomically. Omit during update to preserve existing assignments; send an empty array to remove all assignments.
          items: { $ref: '#/components/schemas/UUID' }
        standard_variant:
          type: object
          description: Required when a POS SIMPLE merchant creates a product. The backend creates the sole sellable and stock-tracked variant atomically.
          required: [base_unit_id]
          properties:
            base_unit_id: { $ref: '#/components/schemas/UUID' }
            attributes: { type: object, additionalProperties: true }
            is_stock_tracked: { type: boolean, default: true }
    Product:
      type: object
      required: [id, merchant_id, name, product_type, is_active, category_ids, category_names, images, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        merchant_id: { $ref: '#/components/schemas/UUID' }
        brand_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        product_type: { type: string }
        manufacture_date: { type: string, format: date, nullable: true }
        expired_date: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        category_ids:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        category_names:
          type: array
          items: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/CatalogImage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductEnvelope:
      allOf: [{ $ref: '#/components/schemas/ResourceEnvelope' }]
    ProductCollectionEnvelope:
      allOf: [{ $ref: '#/components/schemas/CollectionEnvelope' }]
    StorageItem:
      type: object
      required: [id, catalog, product_name, variant_name, unit, stock_count]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        catalog: { type: string, description: Parent/child category paths joined with an arrow. }
        product_name: { type: string }
        variant_name: { type: string }
        brand: { type: string }
        unit: { type: string }
        stock_count: { type: string }
        sell_price: { type: string, description: 'Current RETAIL price, visible to merchant and staff users.' }
