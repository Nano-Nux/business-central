    patch:
      tags: [Repairs]
      summary: Update a repair work item
      operationId: updateRepairWorkItem
      security: [{ bearerAuth: [] }]
      description: Updates the child lifecycle status, assignment, device-specific issue, device data, notes, or validated dynamic fields without changing the ticket-level billing or payment boundary.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepairWorkItemUpdateRequest' } } } }
      responses: { '200': { description: Work item updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } }
  /api/v1/repairs/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [Repairs]
      summary: Get a shop-scoped repair order
      operationId: getRepairOrder
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Repair order, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Repairs]
      summary: Update a repair order
      operationId: updateRepairOrder
      security: [{ bearerAuth: [] }]
      description: Repair status is one of `RECEIVED`, `IN_PROGRESS`, `READY_FOR_PICKUP`, `COMPLETED` (displayed as Complete and closed), or `REFUNDED` (displayed as Refund). Completing is allowed with an outstanding balance; the final payment remains optional and can be recorded later. Completing the parent atomically marks all of its work items as `COMPLETED`. An unpaid canonical order remains `PENDING_PAYMENT` until payment is captured. A repair refund moves the ticket to `REFUNDED` when the captured balance reaches zero.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }
      responses: { '200': { description: Repair order updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } }
    delete:
      tags: [Repairs]
      summary: Delete a repair order
      operationId: deleteRepairOrder
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Repair order deleted } }
  /api/v1/repairs/orders/{id}/details:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch:
      tags: [Repairs]
      summary: Update repair ticket intake details as the merchant owner
      operationId: updateRepairTicketDetails
      security: [{ bearerAuth: [] }]
      description: Requires the system `owner` or `merchant` role. This command changes the customer snapshot, ticket note, reported issue, and device waiting-time details only; it does not change status, payments, parts, or totals. When `work_items` is supplied, each existing child work item's device identifiers, issue, note, and waiting end are updated atomically. Waiting time may be supplied as waiting_days or waiting_end_date; the backend preserves the automatic start date and derives the other representation. The parent issue summary follows the first child, while the ticket waiting period is derived from the earliest child start and latest child end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: { type: string, nullable: true }
                customer_phone: { type: string, nullable: true }
                issue_description: { type: string }
                note: { type: string, nullable: true }
                work_items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [id, issue_description]
                    properties:
                      id: { type: string, format: uuid }
                      issue_description: { type: string }
                      issues: { type: array, maxItems: 20, items: { type: string, maxLength: 500 } }
                      conditions: { type: array, maxItems: 20, items: { type: string, maxLength: 500 } }
                      note: { type: string, nullable: true }
                      waiting_days: { type: integer, minimum: 0 }
                      waiting_end_date: { type: string, format: date }
                      device:
                        type: object
                        required: [device_type]
                        properties:
                          device_type: { type: string }
                          manufacturer: { type: string, nullable: true }
                          model: { type: string, nullable: true }
                          serial_number: { type: string, nullable: true }
      responses: { '200': { description: Repair ticket details updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/repairs/orders/{id}/billing:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    patch:
      tags: [Repairs]
      summary: Replace editable repair ticket billing as the merchant owner
      operationId: updateRepairTicketBilling
      security: [{ bearerAuth: [] }]
      description: Requires the system owner or merchant role. Replaces catalog service lines, labor fee, per-work-item prices (represented by the compatibility field additional_fee), and the current service promotion. The backend recalculates canonical subtotal, discount, tax, total, and work-item financial projections while preserving replacement-part order lines. Payment status is derived from captured payments and refunds and is changed through the payment and refund endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_items, work_items, labor_fee]
              properties:
                service_items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [service_id, quantity]
                    properties:
                      service_id: { type: string, format: uuid }
                      quantity: { type: string }
                      work_item_id: { type: string, format: uuid }
                work_items:
                  type: array
                  items:
                    type: object
                    required: [id, additional_fee]
                    properties:
                      id: { type: string, format: uuid }
                      additional_fee: { type: string }
                labor_fee: { type: string, description: Ticket-level labor total override. }
                promotion_id: { type: string, format: uuid, nullable: true }
      responses: { '200': { description: Repair ticket billing updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/repairs/orders/{orderId}/payments:
    parameters: [{ $ref: '#/components/parameters/OrderID' }]
    get: { tags: [Repairs], summary: List repair deposits and payments, operationId: listRepairPayments, security: [{ bearerAuth: [] }], responses: { '200': { description: Repair payments, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } } } } }
    post: { tags: [Repairs], summary: Record a repair deposit or final payment, operationId: createRepairPayment, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPaymentRequest' } } } }, responses: { '201': { description: "Payment captured, allocated to work items, and repair balance updated. A full final payment completes the parent ticket, every work item, and the service order; it may also be recorded after manual ticket completion. The linked canonical order advances through CONFIRMED, PROCESSING, and FULFILLED using legal state transitions.", content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/orders/{orderId}/refunds:
    parameters: [{ $ref: '#/components/parameters/OrderID' }]
    get: { tags: [Repairs], summary: List repair payment refunds, operationId: listRepairRefunds, security: [{ bearerAuth: [] }], responses: { '200': { description: Repair refunds, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } } } } }
    post:
      tags: [Repairs]
      summary: Record a repair payment refund
      operationId: createRepairRefund
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, amount, idempotency_key]
              properties:
                payment_id: { type: string, format: uuid }
                amount: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,2})?$' }
                reason: { type: string }
                refund_id: { type: string, format: uuid }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Refund recorded and repair payment balance recalculated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceEnvelope' }
  /api/v1/repairs/orders/{orderId}/images:
    parameters: [{ $ref: '#/components/parameters/OrderID' }]
    get: { tags: [Repairs], summary: List repair device images, operationId: listRepairImages, security: [{ bearerAuth: [] }], responses: { '200': { description: Repair images, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } } } } }
    post: { tags: [Repairs], summary: Attach a repair device image, operationId: createRepairImage, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepairImageRequest' } } } }, responses: { '201': { description: Image attached, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } } }
  /api/v1/repairs/images/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
