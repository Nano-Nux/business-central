      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } } }
      responses: { '201': { description: Repair order created, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceEnvelope' } } } } }
  /api/v1/repairs/tickets:
    post:
      tags: [Repairs]
      summary: Atomically create a complete repair ticket
      operationId: createRepairTicket
      security: [{ bearerAuth: [] }]
      description: Creates the canonical SERVICE order, service order, repair order, one or more device work items, independently quantified replacement parts, optional deposit or final payment, and images in one database transaction. Catalog labor is backend-authoritative. Parts and images may include `work_item_id` for device assignment; omitting it keeps the record ticket-level. The idempotency key prevents duplicate tickets on retries. Any failure rolls back the entire ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepairTicketRequest' }
      responses:
        '201':
          description: Complete repair ticket created atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepairTicketEnvelope' }
        '409': { description: Idempotency key conflict. }
