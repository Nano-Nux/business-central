name: business-central-datastore

services:
  postgres:
    image: postgres:17-alpine
    container_name: business-central-postgres
    restart: unless-stopped
    init: true
    # Hard RAM limit requested for PostgreSQL. memswap_limit allows up to
    # another 80 MB in host swap instead of making an immediate OOM kill.
    mem_limit: 80m
    memswap_limit: 160m
    shm_size: 16m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_central}
      POSTGRES_USER: ${POSTGRES_USER:-business_central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=20
      - -c
      - shared_buffers=16MB
      - -c
      - effective_cache_size=48MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=8MB
      - -c
      - autovacuum_work_mem=4MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - wal_buffers=1MB
      - -c
      - max_wal_size=128MB
      - -c
      - min_wal_size=32MB
      - -c
      - log_min_messages=warning
    ports:
      - "0.0.0.0:${POSTGRES_PUBLIC_PORT:-4999}:5432"
    volumes:
      - ${DATA_ROOT:-/data/business-central-datastore}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - datastore

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: business-central-seaweedfs
    restart: unless-stopped
    init: true
    # Hard RAM limit requested for SeaweedFS. The additional 100 MB is swap.
    mem_limit: 100m
    memswap_limit: 200m
    environment:
      GOMEMLIMIT: 90MiB
      GOGC: "50"
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data/volume
      - -master.dir=/data/master
      - -master.peers=none
      - -master.port=9333
      - -master.volumeSizeLimitMB=256
      - -master.volumePreallocate=false
      - -master.telemetry=false
      - -volume.max=8
      - -volume.port=8080
      - -volume.index=leveldb
      - -volume.dir.idx=/data/index
      - -volume.disk=ssd
      - -volume.fileSizeLimitMB=128
      - -filer=true
      - -filer.port=8888
      - -filer.port.public=8889
      - -filer.disableDirListing=true
    volumes:
      - ${DATA_ROOT:-/data/business-central-datastore}/seaweedfs:/data
    networks:
      - datastore

  file-proxy:
    image: nginx:1.29-alpine
    container_name: business-central-file-proxy
    restart: unless-stopped
    init: true
    # Remove the image's stock default server so file-server.conf owns ports 80/81.
    command:
      - sh
      - -c
      - rm -f /etc/nginx/conf.d/default.conf && envsubst '$${SEAWEEDFS_AUTH_TOKEN}' < /etc/nginx/templates/file-server.conf.template > /etc/nginx/conf.d/file-server.conf && exec nginx -g 'daemon off;'
    mem_limit: 16m
    memswap_limit: 32m
    environment:
      SEAWEEDFS_AUTH_TOKEN: ${SEAWEEDFS_AUTH_TOKEN:?set SEAWEEDFS_AUTH_TOKEN in .env}
    ports:
      - "0.0.0.0:${FILE_PUBLIC_PORT:-5000}:80"
      - "0.0.0.0:${FILER_PUBLIC_PORT:-5001}:81"
    volumes:
      - ./nginx/file-server.conf.template:/etc/nginx/templates/file-server.conf.template:ro
    depends_on:
      - seaweedfs
    networks:
      - datastore

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: business-central-cloudflared
    restart: unless-stopped
    init: true
    mem_limit: 32m
    memswap_limit: 64m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - file-proxy
    networks:
      - datastore

networks:
  datastore:
    name: business-central-datastore
